<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Test Fuzzy</title></head>
<body>
<script src="../js/fuzzy-engine.js"></script>
<script>
window.onerror=function(e,s,l,c,err){console.log("ERR:"+e+" line:"+l);};
window.onload=function(){
try{
const TE=35,VV=2,SP=25;
for(const E_val of [-13,-8,-5,-3,-2,-1.5,-1.3,-1,-0.5,0]){
  fuzzyEngine.reset();
  const TI=SP-E_val;
  const r=fuzzyEngine.computar(TI,TE,VV,SP);
  const s=r.saidas||{};
  console.log("E="+E_val+" REF="+(r.refCrisp||0).toFixed(1)+" B="+(s.bomba||0).toFixed(0)+"% Alm="+(s.aluminet||0).toFixed(0)+"%");
}
console.log("--- REGRAS ATIVAS E=-1.3 ---");
fuzzyEngine.reset();
const r0=fuzzyEngine.computar(26.3,35,2,25);
(r0.regrasAtivas||[]).forEach(function(ra){console.log(" "+ra.id+" f="+ra.forca+" "+ra.desc);});
}catch(e){console.log("CATCH:"+e);}
};
</script>
</body></html>
